    return `<div class="info-block">

// ═══════════════════════════════════════════════════════════════════════════════
// DEBOUNCING SYSTEM FOR INPUT PROTECTION
// Prevents UI re-renders and Firebase syncs from interrupting user typing
// ═══════════════════════════════════════════════════════════════════════════════

// Global debounce timers for different entity types
let projectInfoSyncTimer = {};
let budgetFieldSyncTimer = {};
let activitySyncTimer = {};
let milestoneSyncTimer = {};
let taskFieldSyncTimer = {};
let debouncedelay = 500; // milliseconds

// Generic debounce function: defers sync until user stops typing
function debouncedSync(timers, key, syncFn, delay = 500) {
  if(timers[key]) clearTimeout(timers[key]);
  timers[key] = setTimeout(() => {
    syncFn();
    delete timers[key];
  }, delay);
}

// Prevent render() calls during typing - only update localStorage
function updateDataWithoutRender(updateFn) {
  updateFn();  // Update state in memory
  sv();        // Save to localStorage immediately (safe backup)
  // Don't call render() - wait for debounce timer
}

function updateProjectInfo(projId, field, value){
  const p = projById(projId); if(!p) return;
  if(!p.projectInfo) p.projectInfo = {};
  p.projectInfo[field] = value;
  sv();

  // Clear previous debounce timer for this project
  if(projectInfoSyncTimer[projId]) clearTimeout(projectInfoSyncTimer[projId]);

  // Debounce sync by 500ms to batch multiple updates
  projectInfoSyncTimer[projId] = setTimeout(() => {
    syncProjectToFirebase(p).then(() => {
      console.log(`✓ Project info saved: ${projId} - ${field} = ${value}`);
    }).catch(err => {
      console.error(`✗ Failed to save project info: ${err.message}`);
    });
    delete projectInfoSyncTimer[projId];
  }, 500);
}

function updateProjectTableRow(projId, tableKey, rowIdx, colIdx, value){
  const p = projById(projId); if(!p) return;
  if(!p.projectInfo[tableKey]) p.projectInfo[tableKey] = [];
  if(!p.projectInfo[tableKey][rowIdx]) p.projectInfo[tableKey][rowIdx] = [];
  p.projectInfo[tableKey][rowIdx][colIdx] = value;

  // Save to localStorage
  sv();
  console.log(`✓ Table cell updated: ${tableKey}[${rowIdx}][${colIdx}] = ${value}`);

  // Sync to Firebase with error handling
  syncProjectToFirebase(p).then(() => {
    console.log(`✓ Firebase synced for ${tableKey} row ${rowIdx}`);
  }).catch(err => {
    console.error(`✗ Firebase sync failed: ${err.message}`);
    console.warn(`  Data saved to localStorage, will retry on next change`);
  });
}

function handleTableCellEdit(projId, tableKey, rowIdx, colIdx, value){
  const p = projById(projId); if(!p) return;
  if(!p.projectInfo[tableKey]) p.projectInfo[tableKey] = [];
  if(!p.projectInfo[tableKey][rowIdx]) p.projectInfo[tableKey][rowIdx] = [];
  p.projectInfo[tableKey][rowIdx][colIdx] = value.trim();

  sv();  // Save to localStorage

  // Debounce Firebase sync using existing projectInfoSyncTimer
  if(projectInfoSyncTimer[projId]) clearTimeout(projectInfoSyncTimer[projId]);
  projectInfoSyncTimer[projId] = setTimeout(() => {
    syncProjectToFirebase(p).then(() => {
      console.log(`✓ Table cell saved: ${tableKey}[${rowIdx}][${colIdx}] = ${value}`);
    }).catch(err => {
      console.error(`✗ Firebase sync failed: ${err.message}`);
    });
    delete projectInfoSyncTimer[projId];
  }, 500);
}

function updateProjectField(projId, fieldPath, value){
  const p = projById(projId);
  if(!p) return;

  value = value.trim();

  // Handle nested paths like 'projectInfo.programNo'
  if(fieldPath.includes('.')){
    const [parent, child] = fieldPath.split('.');
    if(!p[parent]) p[parent] = {};
    p[parent][child] = value;
  } else {
    p[fieldPath] = value;
  }

  sv();  // Save to localStorage

  // Debounce Firebase sync using existing projectInfoSyncTimer
  if(projectInfoSyncTimer[projId]) clearTimeout(projectInfoSyncTimer[projId]);
  projectInfoSyncTimer[projId] = setTimeout(() => {
    syncProjectToFirebase(p).then(() => {
      console.log(`✓ Project field saved: ${fieldPath} = ${value}`);
      renderProjectList();  // Re-render the list to show updated data
    }).catch(err => {
      console.error(`✗ Firebase sync failed: ${err.message}`);
    });
    delete projectInfoSyncTimer[projId];
  }, 500);
}

  const p = projById(projId); if(!p) return;
  if(!p.projectInfo[tableKey]) p.projectInfo[tableKey] = [];
  p.projectInfo[tableKey].push(new Array(colCount).fill(''));

async function deleteAccount(id){
  if(!confirm('Delete this account and all its projects and tasks?')) return;
  const projIds = state.projects.filter(p=>p.accountId===id).map(p=>p.id);

  // Delete all tasks associated with this account from Firebase
  const tasksToDelete = state.tasks.filter(t=>projIds.includes(t.projectId));
  await Promise.all(tasksToDelete.map(t => deleteTaskFromFirebase(t.id)));

  // Delete all projects associated with this account from Firebase
  await Promise.all(projIds.map(projId => deleteProjectFromFirebase(projId)));

  state.tasks = state.tasks.filter(t=>!projIds.includes(t.projectId));
  state.projects = state.projects.filter(p=>p.accountId!==id);
  state.accounts = state.accounts.filter(a=>a.id!==id);
  if(state.selAcct===id){ state.selAcct=null; state.selProj=null; }
  sv(); hideModal(); render();

  // Sync account deletion to Firebase and wait for it to complete
  await deleteAccountFromFirebase(id);

  toast('Account deleted');
}

function saveProject(id){
  const name = document.getElementById('p-name').value.trim();
  if(!name){ alert('Name is required'); return; }
  const accountId = document.getElementById('p-acct').value||null;
  const color = document.querySelector('#proj-color-row .color-swatch.selected')?.dataset.color || COLORS[1];

  // Extract Description
  const description = document.getElementById('p-description')?.value.trim()||null;

  // Extract Budget data
  const budget = parseFloat(document.getElementById('p-budget')?.value)||null;
  const spent = parseFloat(document.getElementById('p-spent')?.value)||null;

  // Extract Schedule data
  const scheduleStatus = document.getElementById('p-schedule')?.value||'on-track';

  // Helper function to normalize date format to ISO (yyyy-mm-dd)
  const normalizeDate = (dateStr) => {
    if(!dateStr) return null;
    const trimmed = dateStr.trim();
    if(!trimmed) return null;

    // If already in ISO format (yyyy-mm-dd), return as-is
    if(/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;

    // Try to parse dd/mm/yyyy format
    const ddmmMatch = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(trimmed);
    if(ddmmMatch) {
      const [, dd, mm, yyyy] = ddmmMatch;
      return `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
    }

    // Try to parse mm/dd/yyyy format
    const mmddMatch = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(trimmed);
    if(mmddMatch) {
      const [, mm, dd, yyyy] = mmddMatch;
      return `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
    }

    // Try to parse from Date object
    const parsed = new Date(trimmed);
    if(!isNaN(parsed.getTime())) {
      const yyyy = parsed.getFullYear();
      const mm = String(parsed.getMonth() + 1).padStart(2, '0');
      const dd = String(parsed.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    return null;
  };

  const startDate = normalizeDate(document.getElementById('p-start')?.value);
  const endDate = normalizeDate(document.getElementById('p-end')?.value);

  // Extract Activities data
  const upcomingActivities = [];
  document.querySelectorAll('.activity-edit-row').forEach(row => {
    const title = row.querySelector('[data-activity-title]')?.value.trim();
    const dueDate = row.querySelector('[data-activity-date]')?.value;
    if(title) upcomingActivities.push({
      id: row.dataset.activityId,
      title,
      dueDate: dueDate||null
    });
  });

  // Extract Milestones data
  const milestones = [];
  document.querySelectorAll('.milestone-edit-row').forEach(row => {
    const title = row.querySelector('[data-milestone-title]')?.value.trim();
    const salesPrice = parseFloat(row.querySelector('[data-milestone-price]')?.value)||null;
    const status = row.querySelector('[data-milestone-status]')?.value||'not-started';
    if(title) milestones.push({
      id: row.dataset.milestoneId,
      title,
      salesPrice,
      status
    });
  });

  let project;
  if(id){
    project = projById(id);
    project.name=name;
    project.accountId=accountId;
    project.color=color;
    project.description=description;
    project.budget=budget;
    project.spent=spent;
    project.scheduleStatus=scheduleStatus;
    project.startDate=startDate;
    project.endDate=endDate;
    // Also save to projectInfo for consistency with progress calculation
    if(!project.projectInfo) project.projectInfo = {};
    project.projectInfo.projStartDate = startDate;
    project.projectInfo.projEndDate = endDate;
    project.archived=!!document.getElementById('p-archived')?.checked;
    project.upcomingActivities=upcomingActivities;
    project.milestones=milestones;
  } else {
    const maxOrder = state.projects.filter(p=>p.accountId===accountId).reduce((m,p)=>Math.max(m,p.order||0),0);
    project = {
      id:uid(),
      name,
      accountId,
      color,
      order:maxOrder+1,
      infoBlocks:defaultInfoBlocks(),
      description,
      budget,
      spent,
      scheduleStatus,
      startDate,
      endDate,
      projectInfo: {
        projStartDate: startDate,
        projEndDate: endDate
      },
      upcomingActivities,
      milestones,
      meetingTopics: []
    };
    state.projects.push(project);
  }
  sv(); hideModal(); render();
  syncProjectToFirebase(project); // Sync to Firestore
}

async function deleteProject(id){
  if(!confirm('Delete this project and all its tasks?')) return;

  // Delete tasks associated with this project from Firebase
  const tasksToDelete = state.tasks.filter(t=>t.projectId===id);
  await Promise.all(tasksToDelete.map(t => deleteTaskFromFirebase(t.id)));

  state.tasks = state.tasks.filter(t=>t.projectId!==id);
  state.projects = state.projects.filter(p=>p.id!==id);
  if(state.selProj===id) state.selProj=null;
  if(state.view===`p:${id}`) state.view='kanban';
  sv(); hideModal(); render();

  // Sync deletion to Firebase and wait for it to complete
  await deleteProjectFromFirebase(id);

  toast('Project deleted');
}

function saveTask(id){
  const title = document.getElementById('t-title').value.trim();
  if(!title){ alert('Title is required'); return; }
  const projectId = document.getElementById('t-proj').value||null;
  const recurring = document.getElementById('t-rec').value||null;
  const urgent = document.getElementById('t-urgent').classList.contains('on-urgent');
  const followup = document.getElementById('t-followup').classList.contains('on-followup');
  const today = document.getElementById('t-today').classList.contains('on-today');
  const done = document.getElementById('t-complete').classList.contains('checked');
  const hidden = document.getElementById('t-hidden').classList.contains('hidden');
  const snoozed = document.getElementById('t-snoozed').classList.contains('snoozed');
  const notes = document.getElementById('t-notes').value.trim();

  // Collect subtasks with flags
  const subs = [...document.querySelectorAll('#sub-list .subtask-row')].map(row=>{
    const subId = row.dataset.subId;
    const inp = row.querySelector(`input[data-sub-title]`);
    const done = row.querySelector('.cb')?.classList.contains('checked')||false;
    const subUrgent = row.querySelector('.sub-urgent')?.classList.contains('on-urgent')||false;
    const subFollowup = row.querySelector('.sub-followup')?.classList.contains('on-followup')||false;
    const subToday = row.querySelector('.sub-today')?.classList.contains('on-today')||false;
    return {id:subId, title:inp?.value.trim()||'', done, urgent:subUrgent, followup:subFollowup, today:subToday};
  }).filter(s=>s.title);

  let t;
  const now = Date.now();
  if(id){
    history.push(`Update task: ${taskById(id)?.title || id}`, state);
    t = taskById(id);
    const snoozedAt = snoozed ? (t.snoozedAt||now) : null;
    Object.assign(t,{title,projectId,recurring,urgent,followup,today,done,hidden,snoozedAt,notes,subs,updated:now});
  } else {
    history.push(`Create task: ${title}`, state);
    const tasksInProj = state.tasks.filter(x=>x.projectId===projectId&&!x.done).length;
    const snoozedAt = snoozed ? now : null;
    t = {id:uid(),title,projectId,recurring,urgent,followup,today,hidden,snoozedAt,notes,subs,done:done||false,order:tasksInProj,createdAt:new Date().toISOString(),updated:now};
    state.tasks.push(t);
  }
  sv();
  syncTaskToFirebase(t); // Sync to Firestore
  hideModal();
  render();
}

function deleteTask(id){
  if(!confirm('Delete this task?')) return;
  history.push(`Delete task: ${taskById(id)?.title || id}`, state);
  state.tasks = state.tasks.filter(t=>t.id!==id);
  sv();
  deleteTaskFromFirebase(id); // Sync deletion to Firestore
  hideModal();
  render();
  toast('Task deleted');
}

function toggleDone(id){

  t.done = !t.done;

}

function toggleHidden(id){
  const t = taskById(id); if(!t) return;
  history.push(`${t.hidden ? 'Unhide' : 'Hide'} task: ${t.title}`, state);
  t.hidden = !t.hidden;
  t.updated = Date.now();

}

function toggleSnoozed(id){
  const t = taskById(id); if(!t) return;
  if(t.snoozedAt){
    history.push(`Unsnoozed task: ${t.title}`, state);
    t.snoozedAt = null;
  } else {
    history.push(`Snoozed task: ${t.title} for 2 weeks`, state);

  }
  t.updated = Date.now();

  restoreScrollPosition();

// DRAG & DROP
// ═══════════════════════════════════════════════════════════════════════════════
let dragTaskId = null;
let dragColProjId = null;
let dragAcctId = null;

// Task and Account Reordering
function getTasksInProject(projId){
  return state.tasks.filter(t=>t.projectId===projId&&!t.done).sort((a,b)=>{
    if(a.urgent && !b.urgent) return -1;
    if(!a.urgent && b.urgent) return 1;
    if(a.today && !b.today) return -1;
    if(!a.today && b.today) return 1;
    if(a.followup && !b.followup) return -1;
    if(!a.followup && b.followup) return 1;
    return (a.order||0) - (b.order||0);
  });
}

function reassignTaskOrder(projId){
  const tasks = getTasksInProject(projId);
  tasks.forEach((t, idx)=>{ t.order = idx; });
}

function moveTaskInOrder(taskId, fromIndex, toIndex){
  const t = taskById(taskId);
  if(!t) return;
  const tasks = getTasksInProject(t.projectId);
  const actualIndex = tasks.findIndex(x=>x.id===taskId);
  if(actualIndex === -1) return;

  if(toIndex > actualIndex){
    for(let i=actualIndex; i<toIndex; i++){
      tasks[i].order = (tasks[i+1].order || 0);
    }
  } else {
    for(let i=actualIndex; i>toIndex; i--){
      tasks[i].order = (tasks[i-1].order || 0);
    }
  }
  t.order = toIndex;
  sv();
}

function reorderAccounts(fromIdx, toIdx){
  const accounts = state.accounts.slice();
  if(fromIdx === toIdx) return;
  const [acc] = accounts.splice(fromIdx, 1);
  accounts.splice(toIdx, 0, acc);
  accounts.forEach((a, i)=>{ a.order = i; });
  sv();
}

function bindDragEvents(){
  document.querySelectorAll('.task-card[draggable=true]').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      dragTaskId = card.dataset.task;
      card.classList.add('dragging-task');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging-task');
      dragTaskId = null;
    });
  });
}

function dropTaskToProj(e, projId){
  e.preventDefault();
  const col = e.currentTarget;
  col.classList.remove('drag-over');
  if(!dragTaskId) return;
  const t = taskById(dragTaskId);
  if(!t) return;
  const oldProj = t.projectId;

  // If same project, reorder tasks
  if(oldProj === projId){
    // Get visible tasks in order (respecting flag sorting)
    const tasks = getTasksInProject(projId);
    if(tasks.length === 0) return;

    const dragIdx = tasks.findIndex(x=>x.id===dragTaskId);
    if(dragIdx === -1) return;

    // Find drop position based on Y coordinate relative to visible tasks
    const tasksContainer = col.querySelector('.col-tasks');
    if(!tasksContainer) return;

    const taskCards = Array.from(tasksContainer.querySelectorAll('.task-card'));
    let dropIdx = taskCards.length;

    // Find which task card the drop is over
    for(let i = 0; i < taskCards.length; i++){
      const card = taskCards[i];
      const cardTaskId = card.dataset.task;
      const dropTaskIdx = tasks.findIndex(x=>x.id===cardTaskId);
      const rect = card.getBoundingClientRect();
      if(e.clientY < rect.top + rect.height / 2){
        dropIdx = dropTaskIdx;
        break;
      }
    }

    // If dropping after last item
    if(taskCards.length > 0 && dropIdx === taskCards.length){
      const lastCard = taskCards[taskCards.length - 1];
      const lastTaskId = lastCard.dataset.task;
      dropIdx = tasks.findIndex(x=>x.id===lastTaskId) + 1;
    }

    // Reorder if position changed
    if(dropIdx !== dragIdx){
      // Remove task from its position and insert at new position
      const allTasks = state.tasks.filter(x=>x.projectId===projId&&!x.done);
      const dragTaskIdx = allTasks.findIndex(x=>x.id===dragTaskId);
      const [draggedTask] = allTasks.splice(dragTaskIdx, 1);

      // Find the target task at dropIdx in the sorted list
      const targetTask = tasks[dropIdx];
      const targetTaskIdx = allTasks.findIndex(x=>x.id===targetTask.id);

      // Insert dragged task at target position
      allTasks.splice(Math.min(targetTaskIdx + 1, allTasks.length), 0, draggedTask);

      // Assign new order values to all tasks
      allTasks.forEach((t, i) => { t.order = i; });

      sv();
      syncTaskToFirebase(t);
      render();
      toast('Task reordered ✓');
    }
    return;
  }

  // Different project - move task
  t.projectId = projId;
  const tasksInNewProj = state.tasks.filter(x=>x.projectId===projId&&!x.done).length;
  t.order = tasksInNewProj;
  sv(); render();
  toast('Task moved to project ✓');
}

function dragColStart(e, projId){

  e.currentTarget.closest('.kanban-col').classList.add('dragging');

// Column drop for reorder — handled on col-header drag events
document.addEventListener('dragover', e=>{
  const col = e.target.closest('.kanban-col');
  if(col && dragColProjId && col.dataset.colProj !== dragColProjId){
    e.preventDefault();
    col.style.outline='2px dashed var(--honey)';
  }
  const acctSec = e.target.closest('.acct-section');
  if(acctSec && dragAcctId && acctSec.dataset.acctSection !== dragAcctId){
    e.preventDefault();
    acctSec.classList.add('acct-drag-target');
  } else if(acctSec && dragColProjId){
    const acctId = acctSec.dataset.acctSection;
    const dragProj = projById(dragColProjId);
    if(dragProj && dragProj.accountId !== acctId){
      e.preventDefault();
      acctSec.classList.add('acct-drag-target');
    }
  }
});
document.addEventListener('dragleave', e=>{
  const col = e.target.closest?.('.kanban-col');
  if(col) col.style.outline='';
  const acctSec = e.target.closest?.('.acct-section');
  if(acctSec) acctSec.classList.remove('acct-drag-target');
});
document.addEventListener('drop', e=>{
  // Handle account reordering
  if(dragAcctId){
    const targetAcctSec = e.target.closest('.acct-section');
    if(targetAcctSec){
      targetAcctSec.classList.remove('acct-drag-target');
      const targetAcctId = targetAcctSec.dataset.acctSection;
      if(targetAcctId && targetAcctId !== dragAcctId){
        const dragIdx = state.accounts.findIndex(a=>a.id===dragAcctId);
        const targetIdx = state.accounts.findIndex(a=>a.id===targetAcctId);
        if(dragIdx !== -1 && targetIdx !== -1){
          // Swap accounts in array
          [state.accounts[dragIdx], state.accounts[targetIdx]] = [state.accounts[targetIdx], state.accounts[dragIdx]];

          // Update order values to match new positions
          state.accounts.forEach((a, idx) => { a.order = idx; });

          // Sync both accounts to Firebase
          syncAccountToFirebase(state.accounts[dragIdx]);
          syncAccountToFirebase(state.accounts[targetIdx]);

          sv(); render(); toast('Accounts reordered ✓');
        }
      }
    }
    return;
  }

  if(!dragColProjId) return;
  const targetCol = e.target.closest('.kanban-col');
  const targetAcctSec = e.target.closest('.acct-section');

  if(targetCol){
    targetCol.style.outline='';
    const targetProjId = targetCol.dataset.colProj;
    if(targetProjId && targetProjId !== dragColProjId){
      const p1 = projById(dragColProjId);
      const p2 = projById(targetProjId);
      if(p1 && p2 && p1.accountId===p2.accountId){
        // Swap order values
        [p1.order, p2.order] = [p2.order||0, p1.order||0];
        // Sync both projects to Firebase
        syncProjectToFirebase(p1);
        syncProjectToFirebase(p2);
        sv(); render(); toast('Projects reordered ✓');
      }
    }
  } else if(targetAcctSec){
    targetAcctSec.classList.remove('acct-drag-target');
    const newAcctId = targetAcctSec.dataset.acctSection;
    const p = projById(dragColProjId);
    if(p && p.accountId!==newAcctId){
      p.accountId = newAcctId;
      sv(); render(); toast('Project moved to account ✓');
    }
  }
});

function csvEscField(v){
  const s = String(v||'').replace(/"/g,'""');
  return s.includes(',') || s.includes('\n') || s.includes('"') ? `"${s}"` : s;
}

function exportCSV(){
  // Check if we're in table view - export table data instead
  if(state.view==='table'){
    exportTableViewCSV();
    return;
  }
  if(state.view==='project-list'){
    exportProjectListCSV();
    return;
  }

  const lines = [];

  // ACCOUNTS - including order
  lines.push('### ACCOUNTS ###');
  lines.push('id,name,color,order');
  state.accounts.forEach(a=>lines.push([a.id,a.name,a.color,a.order||0].map(csvEscField).join(',')));
  lines.push('');

  // PROJECTS - including order
  lines.push('### PROJECTS ###');
  lines.push('id,name,accountId,color,description,startDate,endDate,order');
  state.projects.forEach(p=>lines.push([
    p.id,p.name,p.accountId||'',p.color,p.description||'',p.startDate||'',p.endDate||'',p.order||0
  ].map(csvEscField).join(',')));
  lines.push('');

  // TASKS - including order, hidden, createdAt
  lines.push('### TASKS ###');
  lines.push('id,title,projectId,due,priority,urgent,followup,today,done,recurring,notes,subs,order,hidden,createdAt');
  state.tasks.forEach(t=>lines.push([
    t.id, t.title, t.projectId||'', t.due||'', t.priority||'',
    t.urgent?'1':'', t.followup?'1':'', t.today?'1':'', t.done?'1':'',
    t.recurring||'', t.notes||'', JSON.stringify(t.subs||[]),
    t.order||0, t.hidden?'1':'', t.createdAt||''
  ].map(csvEscField).join(',')));
  lines.push('');

  // PROJECT_INFO - all fields including infoBlocks
  lines.push('### PROJECT_INFO ###');
  lines.push('projectId,contractId,programPN,programNo,productPN,lnContractNo,safetyResp,projStartDate,projEndDate,description,clin,pca,configuration,infoBlocks');
  state.projects.forEach(p=>{
    const pi = p.projectInfo||{};
    lines.push([
      p.id,
      pi.contractId||'',
      pi.programPN||'',
      pi.programNo||'',
      pi.productPN||'',
      pi.lnContractNo||'',
      pi.safetyResp||'',
      pi.projStartDate||'',
      pi.projEndDate||'',
      pi.description||'',
      JSON.stringify(pi.clin||[]),
      JSON.stringify(pi.pca||[]),
      JSON.stringify(pi.configuration||[]),
      JSON.stringify(p.infoBlocks||[])
    ].map(csvEscField).join(','));
  });
  lines.push('');

  // PROJECT_BUDGET_SCHEDULE
  lines.push('### PROJECT_BUDGET_SCHEDULE ###');
  lines.push('projectId,budget,spent,scheduleStatus,upcomingActivities,milestones,budgetCurrency');
  state.projects.forEach(p=>lines.push([
    p.id,
    p.budget||'',
    p.spent||'',
    p.scheduleStatus||'on-track',
    JSON.stringify(p.upcomingActivities||[]),
    JSON.stringify(p.milestones||[]),
    state.budgetCurrency||'USD'
  ].map(csvEscField).join(',')));
  lines.push('');

  // APP_SETTINGS
  lines.push('### APP_SETTINGS ###');
  lines.push('key,value');
  lines.push(['budgetCurrency',state.budgetCurrency||'USD'].map(csvEscField).join(','));
  lines.push(['projectTab',state.projectTab||''].map(csvEscField).join(','));
  lines.push(['collapsed',JSON.stringify(state.collapsed||{})].map(csvEscField).join(','));
  lines.push(['flt',JSON.stringify(state.flt||{})].map(csvEscField).join(','));

  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tasks-hive-${todayStr()}.csv`;
  a.click();
  toast('Exported ✓');

function exportTableViewCSV(){
  const lines = [];
  const accounts = _sortCache.accountsSorted||state.accounts||[];

  lines.push('Account,Project,Task,Priority,Due Date,Urgent,Follow-up,Today');

  for(const a of accounts){
    if(state.selAcct && a.id!==state.selAcct) continue;

    let projs = state.projects.filter(p=>p.accountId===a.id).sort((x,y)=>(x.order||0)-(y.order||0));
    if(state.selProj) projs = projs.filter(p=>p.id===state.selProj);

    for(const p of projs){
      let tasks = filterTasks(state.tasks.filter(t=>t.projectId===p.id&&!t.done));
      tasks.sort((x,y)=>{
        if(x.urgent && !y.urgent) return -1;
        if(!x.urgent && y.urgent) return 1;
        if(x.today && !y.today) return -1;
        if(!x.today && y.today) return 1;
        if(x.followup && !y.followup) return -1;
        if(!x.followup && y.followup) return 1;
        return 0;
      });

      for(const t of tasks){
        lines.push([
          a.name,
          p.name,
          t.title,
          t.priority||'',
          t.due||'',
          t.urgent?'Yes':'No',
          t.followup?'Yes':'No',
          t.today?'Yes':'No'
        ].map(csvEscField).join(','));
      }
    }
  }

  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tasks-${todayStr()}.csv`;
  a.click();
  toast('Table exported ✓');
}

function exportProjectListCSV(){
  const lines = [];

  lines.push('Account,Project,Color,Description,Start Date,End Date,Budget,Status');

  const accounts = _sortCache.accountsSorted||state.accounts||[];

  for(const a of accounts){
    if(state.selAcct && a.id!==state.selAcct) continue;

    let projs = state.projects.filter(p=>p.accountId===a.id).sort((x,y)=>(x.order||0)-(y.order||0));

    for(const p of projs){
      lines.push([
        a.name,
        p.name,
        p.color||'',
        p.description||'',
        p.startDate||'',
        p.endDate||'',
        p.budget||'',
        p.scheduleStatus||'on-track'
      ].map(csvEscField).join(','));
    }
  }

  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `projects-${todayStr()}.csv`;
  a.click();
  toast('Projects exported ✓');
}

function parseCSVLine(line){
  const fields=[]; let f='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'&&inQ&&line[i+1]==='"'){f+='"';i++;}
    else if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){fields.push(f);f='';}
    else f+=c;
  }
  fields.push(f);
  return fields;
}

function importCSV(text){
  const sections={ACCOUNTS:[],PROJECTS:[],TASKS:[],PROJECT_INFO:[],PROJECT_BUDGET_SCHEDULE:[],APP_SETTINGS:[]};
  let cur=null;
  const lines = text.split('\n');
  for(const raw of lines){
    const line = raw.trim();
    if(line==='### ACCOUNTS ###'){cur='ACCOUNTS';continue;}
    if(line==='### PROJECTS ###'){cur='PROJECTS';continue;}
    if(line==='### TASKS ###'){cur='TASKS';continue;}
    if(line==='### PROJECT_INFO ###'){cur='PROJECT_INFO';continue;}
    if(line==='### PROJECT_BUDGET_SCHEDULE ###'){cur='PROJECT_BUDGET_SCHEDULE';continue;}
    if(line==='### APP_SETTINGS ###'){cur='APP_SETTINGS';continue;}
    if(!cur||!line||line.startsWith('id,')||line.startsWith('key,')) continue;
    sections[cur].push(parseCSVLine(line));
  }

  // ACCOUNTS - with order
  state.accounts = sections.ACCOUNTS.map(r=>({
    id:r[0],name:r[1],color:r[2],order:r[3]?parseInt(r[3]):undefined
  }));

  // PROJECTS - with order and initialize projectInfo
  state.projects = sections.PROJECTS.map(r=>({
    id:r[0],name:r[1],accountId:r[2]||null,color:r[3],description:r[4]||null,startDate:r[5]||null,endDate:r[6]||null,order:r[7]?parseInt(r[7]):undefined,
    projectInfo:{contractId:'',programPN:'',programNo:'',productPN:'',lnContractNo:'',safetyResp:'',projStartDate:'',projEndDate:'',description:'',clin:[],pca:[],configuration:[]},
    infoBlocks:[],budget:null,spent:null,scheduleStatus:'on-track',upcomingActivities:[],milestones:[]
  }));

  // TASKS - with order, hidden, createdAt
  state.tasks = sections.TASKS.map(r=>({
    id:r[0],title:r[1],projectId:r[2]||null,due:r[3]||null,priority:r[4]||null,
    urgent:r[5]==='1',followup:r[6]==='1',today:r[7]==='1',done:r[8]==='1',
    recurring:r[9]||null,notes:r[10]||'',subs:JSON.parse(r[11]||'[]'),
    order:r[12]?parseInt(r[12]):undefined,hidden:r[13]==='1',createdAt:r[14]||new Date().toISOString()
  }));

  // PROJECT_INFO - all fields
  for(const r of sections.PROJECT_INFO){
    const p = state.projects.find(x=>x.id===r[0]);
    if(p) {
      p.projectInfo = {
        contractId:r[1]||'',
        programPN:r[2]||'',
        programNo:r[3]||'',
        productPN:r[4]||'',
        lnContractNo:r[5]||'',
        safetyResp:r[6]||'',
        projStartDate:r[7]||'',
        projEndDate:r[8]||'',
        description:r[9]||'',
        clin:r[10]?JSON.parse(r[10]):[],
        pca:r[11]?JSON.parse(r[11]):[],
        configuration:r[12]?JSON.parse(r[12]):[],
      };
      try{ p.infoBlocks=JSON.parse(r[13]||'[]'); }catch(error){
        console.warn(`⚠️ CSV: Invalid infoBlocks JSON for project ${p.name}:`, error.message);
        p.infoBlocks=[];
      }
    }
  }

  // PROJECT_BUDGET_SCHEDULE
  for(const r of sections.PROJECT_BUDGET_SCHEDULE){
    const p = state.projects.find(x=>x.id===r[0]);
    if(p) {
      p.budget = r[1] ? parseFloat(r[1]) : null;
      p.spent = r[2] ? parseFloat(r[2]) : null;
      p.scheduleStatus = r[3] || 'on-track';
      try{ p.upcomingActivities = JSON.parse(r[4]||'[]'); }catch(error){
        console.warn(`⚠️ CSV: Invalid upcomingActivities JSON for project ${p.name}:`, error.message);
        p.upcomingActivities=[];
      }
      try{ p.milestones = JSON.parse(r[5]||'[]'); }catch(error){
        console.warn(`⚠️ CSV: Invalid milestones JSON for project ${p.name}:`, error.message);
        p.milestones=[];
      }
      if(r[6]) state.budgetCurrency = r[6];
    }
  }

  // APP_SETTINGS
  for(const r of sections.APP_SETTINGS){
    const key = r[0];
    const val = r[1];
    if(key==='budgetCurrency') state.budgetCurrency = val;
    else if(key==='projectTab') state.projectTab = val;
    else if(key==='collapsed') try{ state.collapsed = JSON.parse(val); }catch(error){
      console.warn('⚠️ CSV: Invalid collapsed state JSON:', error.message);
      state.collapsed = {accounts:{}, projects:{}, tasks:{}};
    }
    else if(key==='flt') try{ state.flt = JSON.parse(val); }catch(error){
      console.warn('⚠️ CSV: Invalid filter state JSON:', error.message);
      state.flt = {u:false, f:false, t:false};
    }
  }

  sv(); render();

  // Sync all imported data to Firestore
  state.accounts.forEach(account => {
    syncAccountToFirebase(account);
  });
  state.projects.forEach(project => {
    syncProjectToFirebase(project);
  });
  state.tasks.forEach(task => {
    syncTaskToFirebase(task);
  });

  toast('Import successful ✓ Syncing accounts, projects & tasks to Firestore...');
}

function handleImport(e){
  const file = e.target.files[0]; if(!file) return;
  if(!confirm('This will replace all current data. Continue?')){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = ev => { importCSV(ev.target.result); e.target.value=''; };
  reader.readAsText(file);
}

function bindGlobalEvents(){

  document.getElementById('top-nav').addEventListener('click', e=>{
    const tab = e.target.closest('[data-view]');
    if(!tab) return;
    const view = tab.dataset.view;

    // Toggle filters for flag buttons instead of switching view
    if(view === 'today') { state.flt.t = !state.flt.t; sv(); render(); }
    else if(view === 'followup') { state.flt.f = !state.flt.f; sv(); render(); }
    else if(view === 'urgent') { state.flt.u = !state.flt.u; sv(); render(); }
    else { setView(view); }
  });

  // Account bar
  document.getElementById('acct-bar').addEventListener('click', e=>{
    const pill = e.target.closest('[data-acct]');
    if(!pill) return;
    const acctId = pill.dataset.acct||null;
    if(state.selAcct===acctId){ state.selAcct=null; state.selProj=null; }
    else{ state.selAcct=acctId; state.selProj=null; }
    sv(); render();
  });

  // Project bar
  document.getElementById('proj-bar').addEventListener('click', e=>{
    const pill = e.target.closest('[data-proj]');
    if(!pill) return;
    const projId = pill.dataset.proj||null;
    state.selProj = state.selProj===projId ? null : projId;
    sv(); render();
  });

  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click', e=>{
    if(e.target.id==='modal-overlay') hideModal();
  });

  // Escape key & keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(document.getElementById('cmd-palette-overlay').classList.contains('open')) closeCmdPalette();
      else hideModal();
    }
    // Ctrl+K / Cmd+K for command palette
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); openCmdPalette(); }
    // Ctrl+Shift+S / Cmd+Shift+S for manual sync
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==='S'){ e.preventDefault(); manualSync(); toast('🔄 Syncing...'); }
    // Ctrl+Z / Cmd+Z for undo
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){
      e.preventDefault();
      const prevState = history.performUndo();
      if(prevState) {
        Object.assign(state, prevState);
        sv();
        render();
        toast('↶ Undo');
      }
    }
    // Ctrl+Y or Ctrl+Shift+Z / Cmd+Y or Cmd+Shift+Z for redo
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='z')&&(e.key==='y'||e.shiftKey)){
      e.preventDefault();
      const nextState = history.performRedo();
      if(nextState) {
        Object.assign(state, nextState);
        sv();
        render();
        toast('↷ Redo');
      }
    }
  });
}

// HEX GRID + QUEEN BEE
// ═══════════════════════════════════════════════════════════════════════════════
function hexGrid(w,h,sz,col,op){
  // flat-top hexagons: angle=0 → right vertex
  const colStep=sz*1.5, rowH=sz*Math.sqrt(3);
  let s='';
  for(let c=-1;c*colStep<w+sz;c++){
    for(let r=-1;r*rowH<h+rowH;r++){
      const cx=c*colStep, cy=r*rowH+(c%2?rowH/2:0);
      const pts=Array.from({length:6},(_,i)=>{
        const a=Math.PI/3*i;
        return `${(cx+sz*Math.cos(a)).toFixed(1)},${(cy+sz*Math.sin(a)).toFixed(1)}`;
      }).join(' ');
      s+=`<polygon points="${pts}" fill="none" stroke="${col}" stroke-width="1" opacity="${op}"/>`;
    }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0">${s}</svg>`;
}

async function init(){
  loadTheme();
  loadCloudCfg();
  loadSidebarPreference();
  load();

  // Debug: Log Firebase availability
  console.log('🔍 Checking Firebase availability at init time...');
  console.log('  window.db available:', !!window.db);
  console.log('  window.db type:', typeof window.db);
  console.log('  localStorage size:', new Blob(Object.values(localStorage)).size, 'bytes');

  // Wait a bit for Firebase to initialize if it's not ready yet
  if(!window.db) {
    console.warn('⚠️  Firebase not initialized at startup - waiting 1 second...');
    await new Promise(resolve => setTimeout(resolve, 1000));
    console.log('  After wait, window.db available:', !!window.db);
    if(!window.db) {
      console.error('❌ Firebase still not initialized after 1 second');
    }
  }

  // Load from Firestore if available
  if(window.db){
    console.log('✓ Attempting to sync with Firebase...');
    try{
      const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');

      // Load tasks from Firestore
      const tasksSnap = await getDocs(collection(window.db, 'tasks'));
      const firestoreTasks = tasksSnap.docs.map(doc=>({id:doc.id,...doc.data()}));

      // Merge Firebase tasks with local tasks
      // Firebase is primary source, but keep any local tasks not yet in Firebase
      const mergedTasks = [...firestoreTasks]; // Start with all Firebase tasks
      const firestoreTaskIds = new Set(firestoreTasks.map(t => t.id));

      // Add any local tasks that aren't in Firebase yet (newly created, pending sync)
      state.tasks.forEach(localTask => {
        if (!firestoreTaskIds.has(localTask.id)) {
          mergedTasks.push(localTask);
        }
      });

      // Always update state.tasks (even if empty) to catch deletions
      state.tasks = mergedTasks;
      console.log(`✓ Merged ${firestoreTasks.length} Firebase tasks + ${mergedTasks.length - firestoreTasks.length} pending local tasks`);

      // Load projects from Firestore
      const projsSnap = await getDocs(collection(window.db, 'projects'));
      const firestoreProjs = projsSnap.docs.map(doc=>({id:doc.id,...doc.data()}));

      if(firestoreProjs || true){ // Always update from Firebase to catch deletions
        // CRITICAL: Convert Firestore object format back to nested arrays
        // Firebase stores as {0: "a", 1: "b"}, convert back to ["a", "b"]
        const convertFirebaseObjectsToArrays = (fbData) => {
          if(!Array.isArray(fbData)) return [];
          return fbData.map(row => {
            if(Array.isArray(row)) return row; // Already an array, keep it
            if(typeof row === 'object' && row !== null) {
              // Convert object {0:"a", 1:"b"} back to array ["a", "b"]
              const sortedKeys = Object.keys(row).sort((a, b) => parseInt(a) - parseInt(b));
              return sortedKeys.map(key => row[key]);
            }
            return [];
          });
        };

        // CRITICAL FIX v1.5.49: Use ONLY Firebase projects to catch deletions
        // If a project was deleted from Firebase, don't keep it from localStorage
        state.projects = firestoreProjs.map(fbProj => {
          const localProj = state.projects.find(p => p.id === fbProj.id);

          // Convert Firebase table data back to arrays
          const mergedProjectInfo = {
            ...fbProj.projectInfo,
            clin: convertFirebaseObjectsToArrays(fbProj.projectInfo?.clin || []),
            pca: convertFirebaseObjectsToArrays(fbProj.projectInfo?.pca || []),
            configuration: convertFirebaseObjectsToArrays(fbProj.projectInfo?.configuration || []),
            exportLicenses: convertFirebaseObjectsToArrays(fbProj.projectInfo?.exportLicenses || [])
          };

          return {...fbProj,
            projectInfo: mergedProjectInfo,
            scheduleStatus: fbProj.scheduleStatus || localProj?.scheduleStatus || 'on-track'
          };
        });
        console.log(`✓ Synced ${firestoreProjs.length} projects from Firestore (deleted projects removed)`);
      }

      // Load accounts from Firestore
      const acctsSnap = await getDocs(collection(window.db, 'accounts'));
      const firestoreAccts = acctsSnap.docs.map(doc=>({id:doc.id,...doc.data()}));

      // Merge Firebase accounts with local accounts
      // Firebase is primary source, but keep any local accounts not yet in Firebase
      const mergedAccounts = [...firestoreAccts]; // Start with all Firebase accounts
      const firestoreAcctIds = new Set(firestoreAccts.map(a => a.id));

      // Add any local accounts that aren't in Firebase yet (newly created, pending sync)
      state.accounts.forEach(localAcct => {
        if (!firestoreAcctIds.has(localAcct.id)) {
          mergedAccounts.push(localAcct);
        }
      });

      // Always update state.accounts (even if empty) to catch deletions
      state.accounts = mergedAccounts;
      console.log(`✓ Merged ${firestoreAccts.length} Firebase accounts + ${mergedAccounts.length - firestoreAccts.length} pending local accounts`);

      if(firestoreTasks.length > 0 || firestoreProjs.length > 0 || firestoreAccts.length > 0){
        sv(); // Save to localStorage too
      }
    }catch(error){
      console.error('❌ Firebase Error:', {
        message: error.message,
        code: error.code,
        userAgent: navigator.userAgent.substring(0, 100)
      });
      console.log('ℹ️ Working with local data only. Sync will resume when connection is available.');
    }
  } else {
    console.warn('⚠️  Firebase not initialized - using localStorage only');
  }

  // Ensure all projects have proper projectInfo initialization
  initializeProjectInfo();

  // CRITICAL VALIDATION: After merge, ensure all table arrays are valid
  // This catches cases where Firestore might have corrupted or lost array data
  state.projects.forEach(p => {
    if(p.projectInfo) {
      // Ensure each table field is actually an array
      if(!Array.isArray(p.projectInfo.clin)) {
        console.warn(`⚠️  Fixing clin: was ${typeof p.projectInfo.clin}, resetting to []`);
        p.projectInfo.clin = [];
      }
      if(!Array.isArray(p.projectInfo.pca)) {
        console.warn(`⚠️  Fixing pca: was ${typeof p.projectInfo.pca}, resetting to []`);
        p.projectInfo.pca = [];
      }
      if(!Array.isArray(p.projectInfo.configuration)) {
        console.warn(`⚠️  Fixing configuration: was ${typeof p.projectInfo.configuration}, resetting to []`);
        p.projectInfo.configuration = [];
      }
    }
  });

  // Log final state after validation
  const finalNDL = state.projects.find(p => p.name === 'New Digital LHG');
  if(finalNDL) {
    console.log('✅ FINAL STATE after initialization and validation:');
    console.log('  CLIN is array:', Array.isArray(finalNDL.projectInfo?.clin));
    console.log('  CLIN rows:', finalNDL.projectInfo?.clin?.length || 0);
    console.log('  PCA is array:', Array.isArray(finalNDL.projectInfo?.pca));
    console.log('  PCA rows:', finalNDL.projectInfo?.pca?.length || 0);
    console.log('  CONFIG is array:', Array.isArray(finalNDL.projectInfo?.configuration));
    console.log('  CONFIG rows:', finalNDL.projectInfo?.configuration?.length || 0);
  }

  // Add sample data if empty
  if(!state.accounts.length){
    const acct1 = {id:uid(), name:'Acme Corp', color:'#F59E0B'};
    const acct2 = {id:uid(), name:'Personal', color:'#8B5CF6'};

    ];
    sv();
  }

  // Daily hidden tasks auto-unhide at 7:00 AM
  // Define the unhide function FIRST before calling the scheduler
  window.performHiddenTasksUnhide = function(){
    const today = new Date().toDateString();
    state.tasks.forEach(t => {
      t.hidden = false;
      if(t.subs) t.subs.forEach(s => { s.hidden = false; });
    });

    try { render(); } catch(e) { console.error('Render error:', e); }
    console.log(`✓ Hidden tasks auto-unhidden at 7:00 AM`);
  };

  function scheduleHiddenTasksUnhide(){
    const now = new Date();
    const today = now.toDateString();
    const lastHiddenReset = localStorage.getItem('taskhive_last_hidden_reset');
    const currentHour = now.getHours();
    const currentMinutes = now.getMinutes();
    const currentSeconds = now.getSeconds();
    const timeInSeconds = currentHour * 3600 + currentMinutes * 60 + currentSeconds;
    const sevenAMInSeconds = 7 * 3600;

    if(timeInSeconds >= sevenAMInSeconds && lastHiddenReset !== today){
      window.performHiddenTasksUnhide();

    let nextUnhideTime = new Date(now);

  // Simple version tracking - NO auto-reload (prevents infinite loops on iOS)

    // Clear all caches immediately
    if('caches' in window){
      caches.keys().then(names => {
        names.forEach(name => {
          caches.delete(name).then(() => {
            console.log(`🗑️ Cleared cache: ${name}`);

    }
  }

  // Register Service Worker with MAXIMUM cache-busting for iOS PWAs
  if('serviceWorker' in navigator){
    // Force complete cache invalidation with unique identifier

// AUTO SYNC: Sync on page visibility change and periodic refresh
// ═══════════════════════════════════════════════════════════════════════════════
// SYNC TRIGGERING SYSTEM
// ═══════════════════════════════════════════════════════════════════════════════

// Sync state tracking
let syncState = {
  isSyncing: false,
  lastSyncTime: 0,
  lastSyncError: null,
  syncQueue: [],
  minSyncInterval: 5000, // Minimum 5 seconds between syncs (debounce)
  periodicSyncInterval: 30000, // Periodic sync every 30 seconds
};

// Trigger sync with proper debouncing and state management
async function triggerSync(source = 'manual') {
  const now = Date.now();
  const timeSinceLastSync = now - syncState.lastSyncTime;

  // Skip if already syncing
  if(syncState.isSyncing) {
    console.log(`⏳ Sync already in progress (from ${source}), skipping...`);
    return;
  }

  // Skip if synced too recently (debounce)
  if(timeSinceLastSync < syncState.minSyncInterval) {
    console.log(`⏱️ Sync skipped (last sync ${timeSinceLastSync}ms ago, minimum ${syncState.minSyncInterval}ms)`);
    return;
  }

  // Skip if no Firebase connection
  if(!window.db) {
    console.log('⚠️ Firebase not connected, sync skipped');
    return;
  }

  syncState.isSyncing = true;
  const syncStartTime = Date.now();

  try {
    console.log(`🔄 ========== SYNC START (${source}) at ${new Date().toLocaleTimeString()} ==========`);

    // Pull remote changes first
    await pullCloud();

    // Push local changes
    await pushCloud();

    syncState.lastSyncTime = Date.now();
    syncState.lastSyncError = null;
    const duration = syncState.lastSyncTime - syncStartTime;
    console.log(`✅ ========== SYNC COMPLETE in ${duration}ms ==========`);
  } catch(error) {
    syncState.lastSyncError = error;
    console.error(`❌ ========== SYNC FAILED (${error.message}) ==========`);
  } finally {
    syncState.isSyncing = false;
  }
}

// Debounce timer for focus/visibility syncs
let focusSyncTimer = null;

// Page visibility change (tab focus/blur) - debounced to prevent duplicate syncs
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) {
    console.log('📱 Page became visible');
    // Debounce: cancel any pending focus sync and wait 300ms to avoid duplicate syncs
    if(focusSyncTimer) clearTimeout(focusSyncTimer);
    focusSyncTimer = setTimeout(() => {
      triggerSync('visibility-change');
      focusSyncTimer = null;
    }, 300);
  } else {
    console.log('👁️ Page hidden');
  }
});

// Window focus (browser window gains focus) - debounced to prevent duplicate with visibility-change
window.addEventListener('focus', () => {
  console.log('🎯 Window focus detected');
  // Don't trigger sync here - let visibility-change handle it to avoid duplicates
  // This event often fires at the same time as visibilitychange
});

// Periodic sync DISABLED - sync now only on user input/changes
// Use visibility-change, window-focus, and manual triggers instead
// setInterval(() => {
//   if(!document.hidden && window.db) {
//     triggerSync('periodic');
//   }
// }, syncState.periodicSyncInterval);

// Manual sync trigger (can be called from UI or keyboard shortcut)
function manualSync() {
  triggerSync('user-manual');
}

// Expose sync status for debugging
window.getSyncStatus = () => ({
  isSyncing: syncState.isSyncing,
  lastSyncTime: new Date(syncState.lastSyncTime).toLocaleTimeString(),
  lastSyncError: syncState.lastSyncError?.message || 'none',
  secondsSinceLastSync: Math.round((Date.now() - syncState.lastSyncTime) / 1000),
});

function saveTopics() {
  const topicsData = window.topicsData || [];
  localStorage.setItem('taskhive_topics', JSON.stringify(topicsData));
  syncTopicsToFirestore().catch(err => console.error('Topics sync error:', err.message));
}

async function syncTopicsToFirestore() {
  if (!window.db) {
    console.warn('⚠ Firebase not ready for topics sync');
    return;
  }

  try {
    const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
    const topicsData = window.topicsData || [];
    const docRef = doc(window.db, 'appData', 'upcomingTopics');
    await setDoc(docRef, { topics: topicsData }, { merge: true });
    console.log('✅ Topics synced to Firestore:', topicsData.length, 'records');
  } catch (error) {
    console.error('❌ Topics sync failed:', error.code, error.message);
    throw error;
  }
}

function addTopic() {
  if (!window.topicsData) window.topicsData = [];
  window.topicsData.push({
    id: 'topic-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
    account: '',
    program: '',
    topic: ''
  });
  saveTopics();
  render();
}

function deleteTopic(id) {
  window.topicsData = window.topicsData.filter(t => t.id !== id);

  // Delete from Firebase
  if(window.firebaseInitialized && window.rtdb && window.dbRef && window.dbSet){
    window.dbSet(window.dbRef(window.rtdb, `upcomingTopicsData/${id}`), null)
      .catch(e => console.error('❌ Firebase delete failed:', e.code, e.message));
  }

  saveTopics();
  render();
}

function updateTopic(id, field, value) {
  const topic = window.topicsData.find(t => t.id === id);
  if (topic) {
    topic[field] = value;
    saveTopics();
    render();
  }
}

function exportTopics() {
  const headers = ['Account', 'Program', 'Topic'];
  const rows = [(window.topicsData || []).map(t => [t.account, t.program, t.topic])];
  const csv = [headers.join(','), ...rows[0].map(r => r.map(v => `"${(v || '').replace(/"/g, '""')}"`).join(','))];
  const blob = new Blob([csv.join('\n')], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'topics-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();

}

function getProductionDateRange() {
  const now = new Date();
  const startDate = new Date(now.getFullYear(), now.getMonth() - 4, 1);
  const endDate = new Date(now.getFullYear(), now.getMonth() + 20, 1);

  const dates = [];
  let current = new Date(startDate);
  while (current < endDate) {
    const year = current.getFullYear();
    const month = String(current.getMonth() + 1).padStart(2, '0');
    dates.push(`${year}-${month}`);
    current.setMonth(current.getMonth() + 1);
  }
  return dates;
}

function initializeProductionData() {
  if (!window.productionData) {
    const stored = localStorage.getItem('productionStatusData');
    window.productionData = stored ? JSON.parse(stored) : [];
    console.log('📦 Production data initialized from localStorage:', window.productionData.length, 'records');
  }
  return window.productionData;
}

function saveProductionData() {
  const prodData = window.productionData || [];
  localStorage.setItem('productionStatusData', JSON.stringify(prodData));

  // Sync individual records to Firebase (not entire array, to avoid write conflicts)
  if(window.firebaseInitialized && window.rtdb && window.dbRef && window.dbSet){
    prodData.forEach(record => {
      if(record && record.id) {
        window.dbSet(window.dbRef(window.rtdb, `productionStatusData/${record.id}`), record)
          .catch(e => console.error('❌ Firebase write failed for', record.id, ':', e.code, e.message));
      }
    });
    console.log('✅ Production data synced to Firebase:', prodData.length, 'records');
  } else {
    console.warn('⚠ Firebase not ready for write');
  }
}

function getProductionStatus(contract, planned, production) {
  if (production === null || production === undefined || production === '') {
    return { status: 'unknown', color: '#9CA3AF', label: 'TBD' };
  }
  const prod = parseInt(production);
  const plan = parseInt(planned) || 0;

  if (prod >= plan) {
    return { status: 'on-track', color: '#10B981', label: '✓' };
  }
  return { status: 'delayed', color: '#EF4444', label: '✗' };
}

function getDeliveryStatus(contractDate, actualDate) {
  if (!actualDate) return { label: 'Planned - On-Time', color: '#10B981' };

  const contract = new Date(contractDate);
  const actual = new Date(actualDate);
  const isOnTime = actual <= contract;

  if (isOnTime) {
    return { label: 'Delivered - On-Time', color: '#10B981' };
  } else {
    return { label: 'Delivered - Late', color: '#EF4444' };
  }
}

        deliveries.sort((a, b) => {
          const dateA = a.contractDate ? new Date(a.contractDate) : new Date('9999-12-31');
          const dateB = b.contractDate ? new Date(b.contractDate) : new Date('9999-12-31');
          return dateA - dateB;
        });

        // Program group header
        html += `<tr>
          <td colspan="5" class="prod-prog-header">
            <div class="prod-color-dot" style="background-color: ${progColor};"></div>
            <span class="prod-prog-name">${progName}</span>
          </td>
        </tr>`;

        for (const del of deliveries) {
          const actualDate = del.actualDate ? new Date(del.actualDate) : null;
          const contractDate = del.contractDate ? new Date(del.contractDate) : null;
          const isPast = actualDate && actualDate < today;

          let dateColorClass = '';
          if (actualDate && contractDate) {
            actualDate.setHours(0, 0, 0, 0);
            contractDate.setHours(0, 0, 0, 0);
            dateColorClass = actualDate <= contractDate ? 'prod-date-green' : 'prod-date-red';
          }

          const rowClass = isPast ? 'row-past' : '';

          html += `<tr class="prod-delivery-row ${rowClass}">
            <td>
              <input type="text" class="prod-input" value="${del.description || ''}" placeholder="Add description"
                onchange="updateProjectDelivery('${del.projectId}', '${del.id}', 'description', this.value)">
            </td>
            <td>
              <input type="text" class="prod-input" value="${del.serialNumber || ''}" placeholder="Serial #"
                onchange="updateProjectDelivery('${del.projectId}', '${del.id}', 'serialNumber', this.value)">
            </td>
            <td>
              <input type="date" class="prod-input" value="${del.contractDate || ''}"
                onchange="updateProjectDelivery('${del.projectId}', '${del.id}', 'contractDate', this.value)">
            </td>
            <td>
              <input type="date" class="prod-input" value="${del.actualDate || ''}"
                onchange="updateProjectDelivery('${del.projectId}', '${del.id}', 'actualDate', this.value)">
            </td>
            <td style="text-align: center; display: flex; gap: 4px; justify-content: center;">
              <button class="btn-delete" onclick="duplicateDelivery('${del.projectId}', '${del.id}')" style="background: #3B82F6;">Duplicate</button>
              <button class="btn-delete" onclick="deleteProjectDelivery('${del.projectId}', '${del.id}')">Delete</button>
            </td>
          </tr>`;
        }
      }
      }
    }

    html += `</tbody>
      </table>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('main').innerHTML = html;
}

function openAddDeliveryModal() {
  const accounts = state.accounts || [];
  const projects = state.projects || [];

  if (accounts.length === 0 || projects.length === 0) {
    alert('Please create at least one Account and Program first.');
    return;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `<div class="modal-box">
    <div class="modal-title">Add Delivery</div>
    <div class="form-group">
      <label class="form-label">Account</label>
      <select class="form-select" id="deliveryAccountId" onchange="updateDeliveryPrograms()">
        <option value="">-- Select Account --</option>
        ${accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Program</label>
      <select class="form-select" id="deliveryProjectId">
        <option value="">-- Select Program --</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Delivery Description</label>
      <input type="text" class="form-input" id="deliveryDescription" placeholder="e.g., Prototype Mockup">
    </div>
    <div class="form-group">
      <label class="form-label">Serial Number</label>
      <input type="text" class="form-input" id="deliverySerialNumber" placeholder="e.g., 2087">
    </div>
    <div class="form-group">
      <label class="form-label">Contract Delivery Date</label>
      <input type="date" class="form-input" id="deliveryContractDate">
    </div>
    <div class="form-group">
      <label class="form-label">Planned/Actual Delivery Date</label>
      <input type="date" class="form-input" id="deliveryActualDate">
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
      <button class="btn-primary" onclick="confirmAddDelivery()">Add</button>
    </div>
  </div>`;

  document.body.appendChild(modal);
}

function updateDeliveryPrograms() {
  const accountId = document.getElementById('deliveryAccountId').value;
  const projects = state.projects || [];
  const filtered = projects.filter(p => p.accountId === accountId);
  const select = document.getElementById('deliveryProjectId');
  select.innerHTML = '<option value="">-- Select Program --</option>' +
    filtered.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

function confirmAddDelivery() {
  const accountId = document.getElementById('deliveryAccountId').value;
  const projectId = document.getElementById('deliveryProjectId').value;
  const description = document.getElementById('deliveryDescription').value;
  const serialNumber = document.getElementById('deliverySerialNumber').value;
  const contractDate = document.getElementById('deliveryContractDate').value;
  const actualDate = document.getElementById('deliveryActualDate').value;

  if (!accountId) {
    alert('Please select an Account');
    return;
  }

  if (!projectId) {
    alert('Please select a Program');
    return;
  }

  if (!serialNumber) {
    alert('Please enter Serial Number');
    return;
  }

  const proj = state.projects.find(p => p.id === projectId);
  if (!proj) return;

  if (!proj.deliveryData) proj.deliveryData = [];

  proj.deliveryData.push({
    id: `del-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
    description,
    serialNumber,
    contractDate,
    actualDate
  });

  sv();
  syncProjectToFirebase(proj).then(() => {
    renderProductionStatus();
  }).catch(err => {
    console.error('Failed to sync delivery:', err.message);
  });
  document.querySelector('.modal-backdrop').remove();
}

function openQuickAddDelivery(projectId) {
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `<div class="modal-box">
    <div class="modal-title">Add Delivery</div>
    <div class="form-group">
      <label class="form-label">Serial Number</label>
      <input type="text" class="form-input" id="quickSerialNumber" placeholder="e.g., 2087">
    </div>
    <div class="form-group">
      <label class="form-label">Contract Delivery Date</label>
      <input type="date" class="form-input" id="quickContractDate">
    </div>
    <div class="form-group">
      <label class="form-label">Actual / Planned Delivery Date</label>
      <input type="date" class="form-input" id="quickActualDate">
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
      <button class="btn-primary" onclick="confirmQuickDelivery('${projectId}')">Add</button>
    </div>
  </div>`;

  document.body.appendChild(modal);
}

function confirmQuickDelivery(projectId) {
  const serialNumber = document.getElementById('quickSerialNumber').value;
  const contractDate = document.getElementById('quickContractDate').value;
  const actualDate = document.getElementById('quickActualDate').value;

  if (!serialNumber) {
    alert('Please enter Serial Number');
    return;
  }

  const proj = state.projects.find(p => p.id === projectId);
  if (!proj) return;

  if (!proj.deliveryData) proj.deliveryData = [];

  proj.deliveryData.push({
    id: `del-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
    serialNumber,
    contractDate,
    actualDate
  });

  sv();
  syncProjectToFirebase(proj).then(() => {
    renderProductionStatus();
  }).catch(err => {
    console.error('Failed to sync delivery:', err.message);
  });
  document.querySelector('.modal-backdrop').remove();
}

function updateProjectDelivery(projectId, deliveryId, field, value) {
  const proj = state.projects.find(p => p.id === projectId);
  if (proj && proj.deliveryData) {
    const del = proj.deliveryData.find(d => d.id === deliveryId);
    if (del) {
      del[field] = value;
      sv();
      syncProjectToFirebase(proj).catch(err => {
        console.error('Failed to sync delivery update:', err.message);
      });
    }
  }
}

function duplicateDelivery(projectId, deliveryId) {
  const proj = state.projects.find(p => p.id === projectId);
  if (!proj || !proj.deliveryData) return;

  const delIndex = proj.deliveryData.findIndex(d => d.id === deliveryId);
  if (delIndex === -1) return;

  const original = proj.deliveryData[delIndex];
  const duplicate = {
    ...original,
    id: `del-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`
  };

  // Insert right after the original
  proj.deliveryData.splice(delIndex + 1, 0, duplicate);
  sv();
  syncProjectToFirebase(proj).then(() => {
    renderProductionStatus();
  }).catch(err => {
    console.error('Failed to sync duplicate:', err.message);
  });
}

function deleteProjectDelivery(projectId, deliveryId) {
  if (!confirm('Delete this delivery?')) return;

  const proj = state.projects.find(p => p.id === projectId);
  if (proj && proj.deliveryData) {
    proj.deliveryData = proj.deliveryData.filter(d => d.id !== deliveryId);
    sv();
    syncProjectToFirebase(proj).then(() => {
      renderProductionStatus();
    }).catch(err => {
      console.error('Failed to sync deletion:', err.message);
    });
  }
}

function exportProductionCSV() {
  const accounts = state.accounts || [];
  const projects = state.projects || [];

  let csv = 'Account,Program,Serial Number,Contract Delivery Date,Actual/Planned Delivery Date,Status\n';

  for (const proj of projects) {
    if (!proj.deliveryData || proj.deliveryData.length === 0) continue;

    const acct = accounts.find(a => a.id === proj.accountId);
    const acctName = acct?.name || 'Unknown';

    for (const delivery of proj.deliveryData) {
      const status = getDeliveryStatus(delivery.contractDate, delivery.actualDate);
      csv += `"${acctName}","${proj.name}","${delivery.serialNumber || ''}",` +
             `"${delivery.contractDate || ''}","${delivery.actualDate || ''}","${status.label}"\n`;
    }
  }

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `deliveries-${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
  window.URL.revokeObjectURL(url);
}

function toggleProdAcctCollapse(acctId) {
  if (!window.prodCollapsed) window.prodCollapsed = {};
  window.prodCollapsed[acctId] = !window.prodCollapsed[acctId];
  renderProductionStatus();
}

window.renderProductionStatus = renderProductionStatus;
window.toggleProdAcctCollapse = toggleProdAcctCollapse;
window.openAddDeliveryModal = openAddDeliveryModal;
window.updateDeliveryPrograms = updateDeliveryPrograms;
window.confirmAddDelivery = confirmAddDelivery;
window.openQuickAddDelivery = openQuickAddDelivery;
window.confirmQuickDelivery = confirmQuickDelivery;
window.deleteProjectDelivery = deleteProjectDelivery;
window.updateProjectDelivery = updateProjectDelivery;
window.duplicateDelivery = duplicateDelivery;
window.exportProductionCSV = exportProductionCSV;
window.getDeliveryStatus = getDeliveryStatus;

// Global export function
function exportCurrentView() {
  const view = state.view;
  if (view === 'upcoming-topics') {
    exportTopics();
  } else if (view === 'production-status') {
    exportProductionCSV();
  } else if (view === 'repair-status') {
    exportRepairData?.();
  } else {
    alert('Export not available for this view');
  }
}
window.exportCurrentView = exportCurrentView;

window.addEventListener('DOMContentLoaded', init);

// Cleanup Firebase listeners on page unload
window.addEventListener('beforeunload', () => {
  if(window.firestoreUnsubscribers && window.firestoreUnsubscribers.length > 0) {
    console.log(`🧹 Cleaning up ${window.firestoreUnsubscribers.length} Firestore listener(s)`);
    window.firestoreUnsubscribers.forEach((unsub, idx) => {
      try {
        unsub();
        console.log(`✅ Unsubscribed listener ${idx + 1}`);
      } catch(error) {
        console.error(`❌ Error unsubscribing listener ${idx + 1}:`, error.message);
      }
    });
    window.firestoreUnsubscribers = [];
  }
});
</script>
